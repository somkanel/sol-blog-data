name: Blog writing statistics

on:
  schedule:
    - cron: '20 5,17 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/writing_stats.py
      - requirements-writing.txt
      - .github/workflows/writing-stats.yml

permissions:
  contents: write

concurrency:
  group: blog-writing-stats
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-writing.txt
      - run: pip install -r requirements-writing.txt
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_writing_activity.cjs
      - name: Scan all historical Daily and Article posts
        run: python scripts/writing_stats.py
      - name: Publish complete statistics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add writing-data/writing-stats.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: update all-time blog writing statistics'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Keep failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: writing-statistics-errors
          path: writing-data/*.errors.json
          if-no-files-found: ignore
